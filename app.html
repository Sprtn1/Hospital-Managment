<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hospital Management Database</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="loading-screen" class="loading-screen">
    <div class="spinner"></div>
    <p>Loading hospital records</p>
  </div>

  <div id="app-shell" class="app-shell hidden">
    <button id="sidebar-overlay" class="sidebar-overlay hidden" aria-label="Close navigation"></button>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand-mark small">H</div>
        <div>
          <strong>Hospital DB</strong>
          <span>Management System</span>
        </div>
      </div>
      <nav id="navigation" class="navigation"></nav>
      <div class="sidebar-footer">
        <div class="staff-avatar" id="staff-avatar">S</div>
        <div class="staff-details">
          <strong id="staff-name">Staff User</strong>
          <span id="staff-email"></span>
        </div>
        <button id="logout-button" class="button ghost full">Sign Out</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title">
          <button id="menu-button" class="menu-button" aria-label="Open navigation">☰</button>
          <div>
            <h1 id="page-title">Dashboard</h1>
            <p id="page-subtitle" class="muted">Hospital database summary</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="refresh-current-button" class="icon-action" type="button" title="Refresh current page" aria-label="Refresh current page">↻</button>
          <button id="theme-button" class="icon-action" type="button" title="Change theme" aria-label="Change theme">◐</button>
        </div>
      </header>

      <section id="dashboard-page" class="page"></section>

      <section id="entity-page" class="page hidden">
        <div class="content-card table-workspace">
          <div class="workspace-heading">
            <div>
              <span class="eyebrow">Database table</span>
              <strong id="entity-record-count">0 records</strong>
            </div>
            <div class="toolbar-actions">
              <button id="export-button" class="button secondary">Export CSV</button>
              <button id="new-record-button" class="button primary">+ New Record</button>
            </div>
          </div>
          <div class="filter-bar">
            <div class="search-field">
              <span>⌕</span>
              <input id="search-input" type="search" placeholder="Search all fields">
            </div>
            <select id="filter-column" aria-label="Filter column">
              <option value="">All columns</option>
            </select>
            <div id="filter-value-wrap" class="filter-value-wrap">
              <input id="filter-value" type="search" placeholder="Filter value">
            </div>
            <button id="clear-search-button" class="button subtle">Reset</button>
          </div>
          <div class="table-card flat">
            <div class="table-scroll">
              <table>
                <thead id="entity-head"></thead>
                <tbody id="entity-body"></tbody>
              </table>
            </div>
            <p id="entity-empty" class="empty-state hidden">No records match your search or filters.</p>
            <div class="table-footer">
              <label>Rows
                <select id="page-size">
                  <option value="10">10</option>
                  <option value="25" selected>25</option>
                  <option value="50">50</option>
                  <option value="100">100</option>
                </select>
              </label>
              <span id="page-status">0–0 of 0</span>
              <div class="pagination-actions">
                <button id="previous-page" class="icon-action" type="button" aria-label="Previous page">‹</button>
                <button id="next-page" class="icon-action" type="button" aria-label="Next page">›</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="reports-page" class="page hidden">
        <div class="content-card table-workspace">
          <div class="workspace-heading">
            <div>
              <span class="eyebrow">Prepared database view</span>
              <strong id="report-record-count">0 results</strong>
            </div>
            <div class="toolbar-actions">
              <button id="run-report-button" class="button primary">Run Report</button>
              <button id="export-report-button" class="button secondary">Export CSV</button>
            </div>
          </div>
          <div class="filter-bar report-filter-bar">
            <select id="report-select"></select>
            <div class="search-field">
              <span>⌕</span>
              <input id="report-search" type="search" placeholder="Search report results">
            </div>
          </div>
          <div class="table-card flat">
            <div class="table-scroll">
              <table>
                <thead id="report-head"></thead>
                <tbody id="report-body"></tbody>
              </table>
            </div>
            <p id="report-empty" class="empty-state hidden">No report results found.</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="record-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-panel">
      <div class="modal-header">
        <div><span class="eyebrow">Hospital database</span><h2 id="modal-title">Record</h2></div>
        <button id="close-modal-button" class="icon-button" aria-label="Close">×</button>
      </div>
      <form id="record-form">
        <div id="form-fields" class="form-grid"></div>
        <div class="modal-actions">
          <button id="delete-button" type="button" class="button danger hidden">Delete</button>
          <div class="spacer"></div>
          <button id="cancel-button" type="button" class="button secondary">Cancel</button>
          <button id="save-button" type="submit" class="button primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
